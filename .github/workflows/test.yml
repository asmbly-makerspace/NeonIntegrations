name: Run pytest
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_class_fields.py compares the SSM seed with the table in git history
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - '*'
