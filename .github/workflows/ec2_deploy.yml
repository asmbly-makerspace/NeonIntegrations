name: Deploy to AdminBot EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.repository == 'asmbly-makerspace/NeonIntegrations' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy to EC2
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        DEPLOY_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        # SSM runs commands as root; run the README's update steps as ec2-user instead.
        # --ff-only fails the deploy if main on the instance has diverged.
        # remote_cmd goes inside single quotes below, so it must not contain any.
        remote_cmd="cd /home/ec2-user/NeonIntegrations \
          && git fetch origin main \
          && git checkout main \
          && git merge --ff-only $DEPLOY_SHA \
          && python3.12 -m pip install -r requirements.txt"
        params=$(jq -n --arg cmd "sudo -u ec2-user -H bash -lc '$remote_cmd'" '{commands: [$cmd]}')

        command_id=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy $DEPLOY_SHA" \
          --parameters "$params" \
          --query Command.CommandId \
          --output text)
        echo "Sent SSM command $command_id"

        # The waiter gives up after ~100 s, so retry while the command is still running.
        # Needs ssm:GetCommandInvocation on the role.
        for _ in 1 2 3; do
          if aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"; then
            break
          fi
          status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          case "$status" in
            Pending|InProgress|Delayed) echo "Command is still $status" ;;
            *) break ;;
          esac
        done

        # Print the instance's output, then fail unless the command succeeded.
        invocation=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json)
        echo "----- stdout from the instance -----"
        jq -r .StandardOutputContent <<< "$invocation"
        echo "----- stderr from the instance -----"
        jq -r .StandardErrorContent <<< "$invocation"
        status=$(jq -r .Status <<< "$invocation")
        if [ "$status" != "Success" ]; then
          echo "::error::EC2 deploy did not succeed: SSM command $command_id has status $status (exit code $(jq -r .ResponseCode <<< "$invocation"))"
          exit 1
        fi
