AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Asmbly MCP server: lets the Asmbly org on claude.ai troubleshoot member door
  access. Read-only against Neon and Alta Open. PARKED until sign-in is built.

# -----------------------------------------------------------------------------
# PARKED: DO NOT DEPLOY YET
#
# The hosted server has no sign-in yet. It waits on the Asmbly Login Service
# (see ../DEPLOY.md). The rule below makes any deploy stop with that message,
# and the server itself also refuses to start. Remove the rule when sign-in
# is built, along with the Metadata block that tells the linter the rule is
# always false on purpose.
# -----------------------------------------------------------------------------
Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W8003

Rules:
  HostedModeIsParked:
    Assertions:
      - Assert: !Equals [parked, ready]
        AssertDescription: >-
          Hosted mode is parked: it has no sign-in yet and waits on the Asmbly
          Login Service. See asmbly_mcp/DEPLOY.md.

# -----------------------------------------------------------------------------
# KEYS THIS SERVER NEEDS
#
# No key values are stored in this file or anywhere in the repo. Each setting
# below is the NAME of a parameter in AWS Systems Manager Parameter Store.
# The server reads the values at startup, and is given permission to read
# these four parameters and nothing else.
#
# They are this server's OWN keys, from API users made for it, not the door
# sync's keys. That way they can be shut off without touching the door sync.
# Neon and Alta Open don't offer read-only keys, so give those API users the
# narrowest permissions each system allows. Deployment fails with a clear
# error if any of the four doesn't exist yet.
#
# Sign-in settings will be added here when sign-in is built.
# -----------------------------------------------------------------------------
Parameters:
  NeonApiUserParam:
    Type: AWS::SSM::Parameter::Name
    Default: /asmbly-mcp/neon_api_user
    Description: Parameter holding the Neon API user (org ID).
  NeonApiKeyParam:
    Type: AWS::SSM::Parameter::Name
    Default: /asmbly-mcp/neon_api_key
    Description: >
      Parameter holding the API key of a Neon system user made for this server.
      Not the door sync's key.
  AltaApiUserParam:
    Type: AWS::SSM::Parameter::Name
    Default: /asmbly-mcp/altaopen_api_user
    Description: Parameter holding an Alta Open API user made for this server.
  AltaApiKeyParam:
    Type: AWS::SSM::Parameter::Name
    Default: /asmbly-mcp/altaopen_api_key
    Description: >
      Parameter holding that Alta Open user's API key.
      Not the door sync's key.

  AllowedNeonAccountTypes:
    Type: String
    Default: Paid Staff
    Description: >
      Who may use the server: people whose Neon member account has one of these
      account types ("Individual Type" in Neon). Separate several with commas,
      for example "Paid Staff, Leader". The names must match Neon exactly.
      These types also control door access, so never give someone a type just
      to let them use this server.
  PublicUrl:
    Type: String
    Default: https://mcp.asmbly.org
    Description: >
      The address people and claude.ai reach the server at. Sign-in links are built
      from it. The certificate and DNS record that point this name at the function
      are not in this template yet (see ../DEPLOY.md).

Resources:
  McpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # paths are relative to this file: build from the repo root
      DockerContext: ../..
      Dockerfile: asmbly_mcp/Dockerfile
      DockerTag: latest
    Properties:
      FunctionName: !Ref AWS::StackName
      Description: Asmbly MCP server for claude.ai (door access troubleshooting)
      PackageType: Image
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref McpLogGroup
      # Public HTTPS address. It has to be reachable from the internet because
      # Claude connects from Anthropic's servers. AuthType NONE means AWS itself
      # doesn't check who is calling; the server has to, by requiring sign-in on
      # every MCP request. That sign-in isn't built yet, which is why this is parked.
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          NEON_API_USER_PARAM: !Ref NeonApiUserParam
          NEON_API_KEY_PARAM: !Ref NeonApiKeyParam
          ALTA_API_USER_PARAM: !Ref AltaApiUserParam
          ALTA_API_KEY_PARAM: !Ref AltaApiKeyParam
          ALLOWED_NEON_ACCOUNT_TYPES: !Ref AllowedNeonAccountTypes
          SIGN_IN_STATE_TABLE: !Ref SignInStateTable
          ASMBLY_MCP_PUBLIC_URL: !Ref PublicUrl
      # Everything the server is allowed to do in AWS. Nothing else.
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadOnlyTheFourKeys
              Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${NeonApiUserParam}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${NeonApiKeyParam}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AltaApiUserParam}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AltaApiKeyParam}
            - Sid: KeepSignInState
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:DescribeTable
                - dynamodb:DescribeTimeToLive
              Resource: !GetAtt SignInStateTable.Arn

  # Who is signed in. Holds registered Claude clients and (encrypted) sign-in
  # tokens so people stay signed in between Lambda runs. No member data.
  # Safe to delete: everyone just signs in again.
  SignInStateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: collection
          AttributeType: S
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: collection
          KeyType: HASH
        - AttributeName: key
          KeyType: RANGE
      # expired sign-ins are removed automatically
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  McpLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: 90

Outputs:
  ConnectorUrl:
    Description: Paste this into claude.ai (Organization settings > Connectors > Add > Custom).
    Value: !Sub ${PublicUrl}/mcp
  FunctionAddress:
    Description: The function's own AWS address, which the PublicUrl name has to be pointed at.
    Value: !GetAtt McpFunctionUrl.FunctionUrl
  LogGroup:
    Description: Where the server's logs go (CloudWatch).
    Value: !Ref McpLogGroup
