[project]
name = "neonintegrations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.64",
    "mailjet-rest>=1.5.1",
    "pydantic>=2.12.3",
    "pytz>=2025.2",
    "requests>=2.32.5",
    "tenacity>=9.0.0",
]

[dependency-groups]
# Left out of the Lambda image (alta_open_lambda/Dockerfile uses --no-dev).
# google-api-python-client is for the classFeedbackAutomation tests.
dev = [
    "google-api-python-client>=2.159.0",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "requests-mock>=1.12.1",
    "types-boto3>=1.40.64",
    "types-requests>=2.32.4.20250913",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    # httplib2 uses deprecated pyparsing API (camelCase instead of snake_case)
    # This is an upstream issue: https://github.com/httplib2/httplib2
    "ignore::DeprecationWarning:httplib2.auth",
]

[tool.coverage.run]
omit = ["archived/*", "examples/*", "tests/*"]

[tool.coverage.report]
omit = ["archived/*", "examples/*", "tests/*"]
